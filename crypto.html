<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Live Pulse</title>
    <!-- Подключаем Chart.js для графиков -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #090d16; color: #f1f5f9; min-height: 100vh; padding: 30px 20px; display: flex; justify-content: center; }
        .wrapper { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 24px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 26px; font-weight: 800; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .refresh-btn { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .refresh-btn:hover { background: #334155; }

        /* Карточки монет */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
        .card { background: #131c2e; border: 1px solid #1e293b; padding: 20px; border-radius: 14px; cursor: pointer; transition: 0.2s; }
        .card:hover, .card.active { border-color: #38bdf8; transform: translateY(-2px); }
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .coin-name { font-weight: 700; font-size: 16px; }
        .coin-price { font-size: 22px; font-weight: 800; }
        .change-tag { font-size: 13px; font-weight: 600; padding: 4px 8px; border-radius: 6px; }
        .up { color: #34d399; background: rgba(52, 211, 153, 0.1); }
        .down { color: #f87171; background: rgba(248, 113, 113, 0.1); }

        /* Секция графика */
        .chart-card { background: #131c2e; border: 1px solid #1e293b; padding: 24px; border-radius: 14px; }
        .chart-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: #94a3b8; }
        canvas { max-height: 320px; }

        /* Калькулятор */
        .calc-box { background: #131c2e; border: 1px solid #1e293b; padding: 20px; border-radius: 14px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .calc-box input { background: #090d16; border: 1px solid #334155; color: #fff; padding: 10px 14px; border-radius: 8px; outline: none; font-size: 16px; width: 140px; }
        .calc-res { font-size: 18px; font-weight: 700; color: #38bdf8; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="header">
            <h1>Crypto Live Pulse</h1>
            <button class="refresh-btn" onclick="fetchData()">Обновить данные</button>
        </div>

        <div class="cards-grid" id="coinsList">
            <!-- Сюда JS загрузит монеты -->
            <div style="color: #64748b;">Загрузка данных с биржи...</div>
        </div>

        <div class="chart-card">
            <div class="chart-title" id="chartHeading">Динамика за 7 дней (Bitcoin)</div>
            <canvas id="priceChart"></canvas>
        </div>

        <div class="calc-box">
            <span>Конвертер:</span>
            <input type="number" id="calcAmount" value="1" min="0" step="any" oninput="calculate()">
            <span id="selectedCoinLabel">BTC =</span>
            <span class="calc-res" id="calcTotal">$0</span>
        </div>
    </div>

    <script>
        let coinsData = {};
        let activeCoin = 'bitcoin';
        let chartInstance = null;

        async function fetchData() {
            try {
                // Запрос к бесплатному API CoinGecko
                const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=bitcoin,ethereum,solana&order=market_cap_desc&sparkline=true&price_change_percentage=24h');
                const data = await res.json();
                
                coinsData = {};
                data.forEach(c => coinsData[c.id] = c);

                renderCards();
                renderChart(activeCoin);
                calculate();
            } catch (err) {
                console.error("Ошибка сети:", err);
                document.getElementById('coinsList').innerHTML = '<div style="color:#f87171;">Лимит запросов API или нет сети. Подожди минуту и нажми обновить.</div>';
            }
        }

        function renderCards() {
            const container = document.getElementById('coinsList');
            container.innerHTML = '';

            Object.values(coinsData).forEach(c => {
                const isUp = c.price_change_percentage_24h >= 0;
                const card = document.createElement('div');
                card.className = `card ${c.id === activeCoin ? 'active' : ''}`;
                card.onclick = () => selectCoin(c.id);

                card.innerHTML = `
                    <div class="card-top">
                        <span class="coin-name">${c.name} (${c.symbol.toUpperCase()})</span>
                        <span class="change-tag ${isUp ? 'up' : 'down'}">${isUp ? '+' : ''}${c.price_change_percentage_24h.toFixed(2)}%</span>
                    </div>
                    <div class="coin-price">$${c.current_price.toLocaleString()}</div>
                `;
                container.appendChild(card);
            });
        }

        function selectCoin(id) {
            activeCoin = id;
            renderCards();
            renderChart(id);
            calculate();
        }

        function renderChart(id) {
            const coin = coinsData[id];
            if (!coin || !coin.sparkline_in_7d) return;

            document.getElementById('chartHeading').innerText = `Динамика цены за 7 дней (${coin.name})`;
            const prices = coin.sparkline_in_7d.price;
            const labels = prices.map((_, i) => ''); // пустые лейблы для плавности

            const ctx = document.getElementById('priceChart').getContext('2d');
            
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: prices,
                        borderColor: '#38bdf8',
                        backgroundColor: 'rgba(56, 189, 248, 0.05)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { 
                            grid: { color: '#1e293b' },
                            ticks: { color: '#64748b' }
                        }
                    }
                }
            });
        }

        function calculate() {
            const amount = parseFloat(document.getElementById('calcAmount').value) || 0;
            const coin = coinsData[activeCoin];
            if (!coin) return;

            document.getElementById('selectedCoinLabel').innerText = `${coin.symbol.toUpperCase()} =`;
            const total = (amount * coin.current_price).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
            document.getElementById('calcTotal').innerText = total;
        }

        fetchData();
    </script>
</body>
</html>
