<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер привычек</title>
    <!-- Подключаем библиотеку конфетти -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #151e32; padding: 28px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 1px solid #1e293b; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 22px; font-weight: 700; }
        .streak { background: #ffedd5; color: #ea580c; padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 4px; }

        .progress-box { background: #1e293b; height: 12px; border-radius: 6px; margin-bottom: 12px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #38bdf8, #818cf8); height: 100%; width: 0%; transition: width 0.4s ease; }
        .status-text { font-size: 13px; color: #94a3b8; text-align: right; margin-bottom: 20px; }

        .input-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid #334155; background: #0b0f19; color: #fff; outline: none; font-size: 14px; }
        input:focus { border-color: #38bdf8; }
        button.add-btn { background: #38bdf8; color: #0b0f19; border: none; padding: 12px 18px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        button.add-btn:hover { background: #7dd3fc; }

        ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        li { display: flex; align-items: center; justify-content: space-between; background: #0b0f19; padding: 14px; border-radius: 10px; border: 1px solid #1e293b; transition: all 0.2s ease; cursor: pointer; }
        li:hover { border-color: #334155; }
        .habit-content { display: flex; align-items: center; gap: 12px; flex: 1; }
        .custom-check { width: 20px; height: 20px; border-radius: 6px; border: 2px solid #475569; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        li.done .custom-check { background: #38bdf8; border-color: #38bdf8; }
        li.done .custom-check::after { content: '✓'; color: #0b0f19; font-size: 12px; font-weight: bold; }
        li.done span { text-decoration: line-through; color: #64748b; }

        .del { background: none; color: #64748b; border: none; font-size: 16px; cursor: pointer; padding: 4px; transition: color 0.2s; }
        .del:hover { color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Мой день</h1>
            <div class="streak">🔥 3 дня ударного режима</div>
        </div>
        
        <div class="progress-box">
            <div class="progress-fill" id="fill"></div>
        </div>
        <div class="status-text" id="status">0 из 0 выполнено</div>

        <div class="input-box">
            <input type="text" id="taskInput" placeholder="Добавить цель на сегодня...">
            <button class="add-btn" onclick="addTask()">Добавить</button>
        </div>

        <ul id="list"></ul>
    </div>

    <script>
        const input = document.getElementById('taskInput');
        const list = document.getElementById('list');
        const fill = document.getElementById('fill');
        const statusText = document.getElementById('status');
        let tasks = JSON.parse(localStorage.getItem('tasks_v2') || '[]');

        function save() {
            localStorage.setItem('tasks_v2', JSON.stringify(tasks));
            render();
        }

        function triggerConfetti() {
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        function render() {
            list.innerHTML = '';
            let done = 0;
            tasks.forEach((t, i) => {
                if (t.done) done++;
                const li = document.createElement('li');
                if (t.done) li.classList.add('done');
                li.innerHTML = `
                    <div class="habit-content">
                        <div class="custom-check"></div>
                        <span>${t.text}</span>
                    </div>
                    <button class="del" onclick="delTask(event, ${i})">✕</button>
                `;
                li.onclick = () => {
                    const wasCompleted = tasks.length > 0 && done === tasks.length;
                    t.done = !t.done;
                    save();
                    
                    // Если после клика все задачи закрыты
                    const newDone = tasks.filter(x => x.done).length;
                    if (newDone === tasks.length && tasks.length > 0 && !wasCompleted) {
                        triggerConfetti();
                    }
                };
                list.appendChild(li);
            });

            const percent = tasks.length ? Math.round((done / tasks.length) * 100) : 0;
            fill.style.width = percent + '%';
            statusText.innerText = `${done} из ${tasks.length} выполнено (${percent}%)`;
        }

        function addTask() {
            const val = input.value.trim();
            if (!val) return;
            tasks.push({ text: val, done: false });
            input.value = '';
            save();
        }

        function delTask(e, i) {
            e.stopPropagation();
            tasks.splice(i, 1);
            save();
        }

        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(); });
        render();
    </script>
</body>
</html>
